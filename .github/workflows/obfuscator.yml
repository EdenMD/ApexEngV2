name: Obfuscate Engine

# Runs on push to main, and can be triggered manually
on:
  push:
    branches: [main]
    paths:
      - 'engine-ci.js'
      - 'src/**'
      - '.obfuscatorrc.json'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to obfuscate and push to'
        required: true
        default: 'main'
        type: string

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout the branch that triggered this run
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref_name }}
          fetch-depth: 0

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install obfuscator
      - name: Install javascript-obfuscator
        run: npm install -g javascript-obfuscator

      # 4. Prepare output directory
      - name: Prepare output directory
        run: mkdir -p _obfuscated/src

      # 5. Obfuscate engine-ci.js
      - name: Obfuscate engine-ci.js
        run: |
          javascript-obfuscator engine-ci.js \
            --config.obfuscatorrc.json \
            --output _obfuscated/engine-ci.js

      # 6. Obfuscate all src/*.js files
      - name: Obfuscate src/ modules
        run: |
          for f in src/*.js; do
            filename=$(basename "$f")
            javascript-obfuscator "$f" \
              --config.obfuscatorrc.json \
              --output "_obfuscated/src/$filename"
            echo "Obfuscated: $filename"
          done

      # 7. Replace original files with obfuscated versions
      - name: Replace engine files with obfuscated versions
        run: |
          cp _obfuscated/engine-ci.js./engine-ci.js
          cp _obfuscated/src/*.js./src/
          rm -rf _obfuscated

      # 8. Commit and push back to same branch
      - name: Commit obfuscated build
        run: |
          git config user.name "APEX Obfuscator Bot"
          git config user.email "bot@apex-engine"
          git add engine-ci.js src/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          COMMIT_SHA=$(git rev-parse --short HEAD)
          git commit -m "chore: obfuscated build from ${COMMIT_SHA} [skip ci]"
          git push origin HEAD:${{ github.event.inputs.target_branch || github.ref_name }}