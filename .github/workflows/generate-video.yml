# .github/workflows/generate-video.yml
# APEX Video Engine v2.0 — GitHub Actions CI Workflow

name: Generate Video

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Config file name (must exist in repo root)'
        required: false
        default: 'config.js'
  push:
    branches: [main]
    paths:
      - 'config.js'
      - 'engine-ci.js'
      - 'src/**'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. System deps ───────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            build-essential \
            pkg-config \
            python3 \
            python3-pip \
            python3-dev \
            espeak-ng \
            espeak-ng-data \
            libespeak-ng-dev \
            libsndfile1 \
            libsndfile1-dev \
            jq

      # ── 3. Cache pip packages ────────────────────────────────────────────
      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: kokoro-pip-${{ runner.os }}-v5

      # ── 4. Install Kokoro TTS ────────────────────────────────────────────
      - name: Install Kokoro TTS dependencies
        run: |
          pip3 install --quiet --upgrade pip
          pip3 install --quiet numpy soundfile
          pip3 install --quiet "misaki[en]"
          pip3 install --quiet "kokoro>=0.9.4"
          echo "--- Verifying Kokoro install ---"
          python3 -c "from kokoro import KPipeline; print('Kokoro OK')"

      # ── 5. Node.js ───────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 6. Ensure package.json ───────────────────────────────────────────
      - name: Ensure package.json exists
        run: |
          if [ ! -f package.json ]; then
            echo '{"name":"apex-videogen","version":"2.0.0","private":true}' > package.json
          fi

      # ── 7. Cache node_modules ────────────────────────────────────────────
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-canvas-v3-${{ hashFiles('package.json') }}

      # ── 8. Install Node deps ─────────────────────────────────────────────
      - name: Install Node dependencies
        run: |
          npm install --save canvas fluent-ffmpeg fs-extra omggif
        env:
          npm_config_build_from_source: true

      # ── 9. Cache Kokoro model weights ────────────────────────────────────
      - name: Cache Kokoro model weights
        uses: actions/cache@v4
        with:
          path: kokoro
          key: kokoro-model-v2

      # ── 10. Prepare work dirs ─────────────────────────────────────────────
      - name: Prepare work directories
        run: mkdir -p work/tts

      # ── 11. Run engine ───────────────────────────────────────────────────
      - name: Generate video
        run: node engine-ci.js
        env:
          VIDEO_CONFIG: ${{ github.event.inputs.config || 'config.js' }}
          NODE_OPTIONS: '--max-old-space-size=6144'
        timeout-minutes: 45

      # ── 12. Upload to Litterbox (primary) ────────────────────────────────
      # Free, anonymous, no API key. 1 GB limit, 72h expiry. Returns direct URL.
      - name: Upload video to Litterbox
        if: success()
        id: litterbox
        run: |
          VIDEO_FILE=$(ls work/*.mp4 2>/dev/null | head -n 1)
          if [ -z "$VIDEO_FILE" ]; then
            echo "No MP4 found in work/ — skipping upload"
            echo "uploaded=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Uploading $VIDEO_FILE to Litterbox..."
          RESPONSE=$(curl -s \
            -F "reqtype=fileupload" \
            -F "time=72h" \
            -F "fileToUpload=@${VIDEO_FILE}" \
            https://litterbox.catbox.moe/resources/internals/api.php)

          # Litterbox returns the raw URL on success, or an error string
          if echo "$RESPONSE" | grep -q "^https://"; then
            echo "✅ Litterbox upload successful!"
            echo "url=$RESPONSE" >> $GITHUB_OUTPUT
            echo "uploaded=true" >> $GITHUB_OUTPUT
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📹 VIDEO DOWNLOAD URL (expires in 72h):"
            echo "$RESPONSE"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          else
            echo "⚠️  Litterbox failed: $RESPONSE"
            echo "uploaded=false" >> $GITHUB_OUTPUT
          fi

      # ── 13. Fallback: Upload to GoFile if Litterbox failed ───────────────
      # No API key, unlimited size. Two-step: get nearest server, then upload.
      - name: Upload video to GoFile (fallback)
        if: success() && steps.litterbox.outputs.uploaded == 'false'
        run: |
          VIDEO_FILE=$(ls work/*.mp4 2>/dev/null | head -n 1)
          if [ -z "$VIDEO_FILE" ]; then
            echo "No MP4 found — nothing to upload"
            exit 0
          fi

          echo "Trying GoFile fallback for $VIDEO_FILE..."

          # Step 1: get best upload server
          SERVER=$(curl -s https://api.gofile.io/servers \
            | jq -r '.data.servers[0].name')

          if [ -z "$SERVER" ] || [ "$SERVER" = "null" ]; then
            echo "❌ Could not reach GoFile API"
            exit 1
          fi

          # Step 2: upload
          RESPONSE=$(curl -s \
            -F "file=@${VIDEO_FILE}" \
            "https://${SERVER}.gofile.io/uploadFile")

          STATUS=$(echo "$RESPONSE" | jq -r '.status')
          if [ "$STATUS" = "ok" ]; then
            LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
            echo "✅ GoFile upload successful!"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📹 VIDEO DOWNLOAD PAGE:"
            echo "$LINK"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          else
            echo "❌ GoFile upload also failed: $RESPONSE"
            exit 1
          fi

      # ── 14. Upload debug logs on failure ─────────────────────────────────
      # Keep a small artifact for TTS/engine logs only — not the video.
      # This uses minimal artifact storage (text files only).
      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-${{ github.run_number }}
          path: work/tts/
          retention-days: 3
          if-no-files-found: ignore