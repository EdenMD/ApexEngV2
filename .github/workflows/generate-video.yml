# .github/workflows/generate-video.yml
# APEX Video Engine v2.0 — GitHub Actions CI Workflow

name: Generate Video

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Config file name (must exist in repo root)'
        required: false
        default: 'config.js'
  push:
    branches: [main]
    paths:
      - 'config.js'
      - 'engine-ci.js'
      - 'src/**'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. System deps ───────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            build-essential \
            pkg-config \
            python3 \
            python3-pip \
            python3-dev \
            espeak-ng \
            espeak-ng-data \
            libespeak-ng-dev \
            libsndfile1 \
            libsndfile1-dev \
            jq

      # ── 3. Cache pip packages ────────────────────────────────────────────
      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: kokoro-pip-${{ runner.os }}-v5

      # ── 4. Install Kokoro TTS ────────────────────────────────────────────
      - name: Install Kokoro TTS dependencies
        run: |
          pip3 install --quiet --upgrade pip
          pip3 install --quiet numpy soundfile
          pip3 install --quiet "misaki[en]"
          pip3 install --quiet "kokoro>=0.9.4"
          echo "--- Verifying Kokoro install ---"
          python3 -c "from kokoro import KPipeline; print('Kokoro OK')"

      # ── 5. Node.js ───────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 6. Ensure package.json ───────────────────────────────────────────
      - name: Ensure package.json exists
        run: |
          if [ ! -f package.json ]; then
            echo '{"name":"apex-videogen","version":"2.0.0","private":true}' > package.json
          fi

      # ── 7. Cache node_modules ────────────────────────────────────────────
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-canvas-v3-${{ hashFiles('package.json') }}

      # ── 8. Install Node deps ─────────────────────────────────────────────
      - name: Install Node dependencies
        run: |
          npm install --save canvas fluent-ffmpeg fs-extra omggif
        env:
          npm_config_build_from_source: true

      # ── 9. Cache Kokoro model weights ────────────────────────────────────
      - name: Cache Kokoro model weights
        uses: actions/cache@v4
        with:
          path: kokoro
          key: kokoro-model-v2

      # ── 10. Prepare work dirs ────────────────────────────────────────────
      - name: Prepare work directories
        run: mkdir -p work/tts

      # ── 11. Run engine ───────────────────────────────────────────────────
      - name: Generate video
        run: node engine-ci.js
        env:
          VIDEO_CONFIG: ${{ github.event.inputs.config || 'config.js' }}
          NODE_OPTIONS: '--max-old-space-size=6144'
        timeout-minutes: 45

      # ── 12. Upload video — 5 platforms tried in sequence ─────────────────
      #
      #  GoFile is primary — dedicated upload infrastructure, no SSL issues,
      #  no size cap. Litterbox removed entirely due to recurring timeouts.
      #
      #  Platform order:
      #   1. GoFile      — no cap,    no expiry,    download-page URL
      #   2. transfer.sh — 10 GB cap, 14-day expiry, direct URL
      #   3. oshi.at     — 25 GB cap, ~90-day expiry, direct URL
      #   4. Filebin     — no cap,    ~6-day idle expiry, direct URL
      #   5. Catbox      — 200 MB cap, permanent, direct URL (small vids only)
      #
      #  curl stall detection: if transfer speed drops below 10 KB/s for
      #  15 consecutive seconds the request is killed and next platform tried.
      #  This prevents silent hangs from wasting runner minutes.
      #
      - name: Upload video (5-platform fallback chain)
        if: success()
        run: |
          divider() { echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"; }
          announce_success() {
            local platform="$1" url="$2" note="$3"
            divider
            echo "✅ Upload successful!"
            echo "🔗 Platform : $platform"
            echo "⏱  Expiry   : $note"
            echo "📹 URL      : $url"
            divider
          }

          VIDEO_FILE=$(ls work/*.mp4 2>/dev/null | head -n 1)
          if [ -z "$VIDEO_FILE" ]; then
            echo "❌ No MP4 found in work/ — nothing to upload"
            exit 1
          fi
          FILENAME=$(basename "$VIDEO_FILE")
          FILESIZE=$(stat -c%s "$VIDEO_FILE")
          echo "🎬 File: $VIDEO_FILE ($(du -sh "$VIDEO_FILE" | cut -f1))"

          # Dynamic max-time: 60s base + 1s per 50 KB, capped at 300s
          MAX_TIME=$(( 60 + FILESIZE / 51200 ))
          [ "$MAX_TIME" -gt 300 ] && MAX_TIME=300
          echo "⏱  Per-platform timeout: ${MAX_TIME}s"

          # Shared curl flags:
          #   --connect-timeout 8  : bail if server doesn't respond in 8s
          #   --speed-limit 10240  : abort if speed < 10 KB/s ...
          #   --speed-time 15      : ... for 15 consecutive seconds
          CURL_FLAGS="--silent --connect-timeout 8 --speed-limit 10240 --speed-time 15 --max-time ${MAX_TIME} --retry 1 --retry-delay 3"

          UPLOADED=false

          # ════════════════════════════════════════════════════════
          # HOST 1 — GoFile  (no cap, no expiry)
          # ════════════════════════════════════════════════════════
          echo ""
          echo "📤 [1/5] GoFile..."
          SERVER=$(curl --silent --connect-timeout 8 --max-time 15 \
            https://api.gofile.io/servers \
            | jq -r '.data.servers[0].name' 2>/dev/null) || true

          if [ -n "$SERVER" ] && [ "$SERVER" != "null" ]; then
            RESPONSE=$(curl $CURL_FLAGS \
              -F "file=@${VIDEO_FILE}" \
              "https://${SERVER}.gofile.io/uploadFile") || true

            STATUS=$(echo "$RESPONSE" | jq -r '.status' 2>/dev/null)
            if [ "$STATUS" = "ok" ]; then
              LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
              announce_success "GoFile" "$LINK" "No expiry"
              UPLOADED=true
            else
              echo "   ⚠️  Failed — ${RESPONSE:-'no response'}"
            fi
          else
            echo "   ⚠️  Could not resolve GoFile server"
          fi

          # ════════════════════════════════════════════════════════
          # HOST 2 — transfer.sh  (10 GB cap, 14-day expiry)
          # ════════════════════════════════════════════════════════
          if [ "$UPLOADED" = "false" ]; then
            echo ""
            echo "📤 [2/5] transfer.sh..."
            RESPONSE=$(curl $CURL_FLAGS \
              --upload-file "$VIDEO_FILE" \
              "https://transfer.sh/${FILENAME}") || true

            if echo "$RESPONSE" | grep -q "^https://"; then
              announce_success "transfer.sh" "$RESPONSE" "14 days"
              UPLOADED=true
            else
              echo "   ⚠️  Failed — ${RESPONSE:-'no response'}"
            fi
          fi

          # ════════════════════════════════════════════════════════
          # HOST 3 — oshi.at  (25 GB cap, ~90-day expiry)
          # ════════════════════════════════════════════════════════
          if [ "$UPLOADED" = "false" ]; then
            echo ""
            echo "📤 [3/5] oshi.at..."
            RESPONSE=$(curl $CURL_FLAGS \
              -F "f=@${VIDEO_FILE}" \
              https://oshi.at) || true

            LINK=$(echo "$RESPONSE" | grep -oP "(?<=DL: )https://\S+" | head -n 1) || true
            if [ -n "$LINK" ]; then
              announce_success "oshi.at" "$LINK" "~90 days"
              UPLOADED=true
            else
              echo "   ⚠️  Failed — ${RESPONSE:-'no response'}"
            fi
          fi

          # ════════════════════════════════════════════════════════
          # HOST 4 — Filebin  (no cap, ~6-day idle expiry)
          # ════════════════════════════════════════════════════════
          if [ "$UPLOADED" = "false" ]; then
            echo ""
            echo "📤 [4/5] Filebin..."
            BUCKET="apex-$(date +%s)-$$"
            RESPONSE=$(curl $CURL_FLAGS \
              -X POST \
              -H "filename: ${FILENAME}" \
              -H "bin: ${BUCKET}" \
              --data-binary "@${VIDEO_FILE}" \
              "https://filebin.net/${BUCKET}/${FILENAME}") || true

            FNAME=$(echo "$RESPONSE" | jq -r '.file.filename' 2>/dev/null)
            if [ -n "$FNAME" ] && [ "$FNAME" != "null" ]; then
              announce_success "Filebin" "https://filebin.net/${BUCKET}/${FILENAME}" "~6 days idle"
              UPLOADED=true
            else
              echo "   ⚠️  Failed — ${RESPONSE:-'no response'}"
            fi
          fi

          # ════════════════════════════════════════════════════════
          # HOST 5 — Catbox  (200 MB cap, permanent)
          # ════════════════════════════════════════════════════════
          if [ "$UPLOADED" = "false" ]; then
            echo ""
            echo "📤 [5/5] Catbox (200 MB cap — last resort)..."
            MAX_CATBOX=$((200 * 1024 * 1024))
            if [ "$FILESIZE" -gt "$MAX_CATBOX" ]; then
              echo "   ⚠️  $(du -sh "$VIDEO_FILE" | cut -f1) exceeds 200 MB Catbox limit, skipping"
            else
              RESPONSE=$(curl $CURL_FLAGS \
                -F "reqtype=fileupload" \
                -F "fileToUpload=@${VIDEO_FILE}" \
                https://catbox.moe/user/api.php) || true

              if echo "$RESPONSE" | grep -q "^https://"; then
                announce_success "Catbox" "$RESPONSE" "Permanent"
                UPLOADED=true
              else
                echo "   ⚠️  Failed — ${RESPONSE:-'no response'}"
              fi
            fi
          fi

          # ── final gate ────────────────────────────────────────
          echo ""
          if [ "$UPLOADED" = "false" ]; then
            echo "❌ All 5 platforms failed. See warnings above."
            exit 1
          fi

      # ── 13. Upload debug logs on failure ─────────────────────────────────
      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-${{ github.run_number }}
          path: work/tts/
          retention-days: 3
          if-no-files-found: ignore