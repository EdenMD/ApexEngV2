- name: Upload video to Litterbox
  if: success()
  id: litterbox
  run: |
    VIDEO_FILE=$(ls work/*.mp4 2>/dev/null | head -n 1)
    if [ -z "$VIDEO_FILE" ]; then
      echo "No MP4 found in work/ — skipping upload"
      echo "uploaded=false" >> $GITHUB_OUTPUT
      exit 0
    fi

    echo "Uploading $VIDEO_FILE to Litterbox..."
    RESPONSE=$(curl -s --max-time 60 \
      -F "reqtype=fileupload" \
      -F "time=72h" \
      -F "fileToUpload=@${VIDEO_FILE}" \
      https://litterbox.catbox.moe/resources/internals/api.php) || true   # ← don't die on curl error

    if echo "$RESPONSE" | grep -q "^https://"; then
      echo "✅ Litterbox upload successful!"
      echo "url=$RESPONSE" >> $GITHUB_OUTPUT
      echo "uploaded=true" >> $GITHUB_OUTPUT
      echo "📹 VIDEO DOWNLOAD URL (expires in 72h):"
      echo "$RESPONSE"
    else
      echo "⚠️  Litterbox failed (response: '$RESPONSE')"
      echo "uploaded=false" >> $GITHUB_OUTPUT
    fi